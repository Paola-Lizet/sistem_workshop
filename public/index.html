<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Sistema UAQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow-lg p-4 bg-white rounded" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h3 class="text-primary fw-bold">Iniciar Sesión</h3>
            <p class="text-muted small">Taller de Node.js - Gestión de Empleados</p>
        </div>

        <div id="alertaError" class="alert alert-danger d-none" role="alert"></div>

        <form id="formLogin">
            <div class="mb-3">
                <label for="user_mail" class="form-label text-secondary fw-semibold">Correo Electrónico</label>
                <input type="email" id="user_mail" class="form-control" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="mb-3">
                <label for="user_password" class="form-label text-secondary fw-semibold">Contraseña</label>
                <input type="password" id="user_password" class="form-control" placeholder="********" required>
            </div>
            <button type="submit" id="btnIngresar" class="btn btn-primary w-100 fw-bold mt-2">
                Ingresar al Sistema
            </button>
        </form>
    </div>
    <script>
        const formLogin = document.getElementById('formLogin');
        const alertaError = document.getElementById('alertaError');

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            alertaError.classList.add('d-none');

            const credenciales = {
                user_mail: document.getElementById('user_mail').value.trim(),
                user_password: document.getElementById('user_password').value
            };

            try {
                const respuesta = await fetch('/user/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(credenciales)
                });

                const datos = await respuesta.json();

                if (respuesta.status === 200) {
                    localStorage.setItem('token', datos.message); 
                
                    window.location.href = 'dashboard.html';
                } else {
                    alertaError.textContent = datos.message || "Error al iniciar sesión";
                    alertaError.classList.remove('d-none');
                }

            } catch (error) {
                console.error("Error en la conexión:", error);
                alertaError.textContent = "No se pudo conectar con el servidor. Verifica que esté corriendo.";
                alertaError.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
